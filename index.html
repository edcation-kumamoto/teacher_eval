<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI教員評価アシスタント</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f0f4f8; color: #0f172a; overflow-x: hidden; }
        
        .eval-text-area {
            font-size: 1.125rem;
            line-height: 2.2;
            color: #1e293b;
            font-weight: 500;
            padding: 2rem;
            min-height: 200px;
            white-space: pre-wrap;
            word-break: break-all;
            border-radius: 1.5rem;
            border: 2px solid #93c5fd;
            transition: border-color 0.2s;
            background-color: #ffffff;
            outline: none;
        }

        .eval-text-area:focus {
            border-color: #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.1);
        }

        .history-text-area {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #64748b;
            padding: 1.5rem;
            background-color: #f8fafc;
            border-radius: 1.25rem;
            border: 1px solid #e2e8f0;
        }

        .sidebar-item {
            transition: all 0.2s;
            background-color: #fef9c3;
            border: 1px solid #fef08a;
        }
        .sidebar-item.active {
            background-color: #eab308;
            color: #ffffff;
            border-color: #d97706;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transform: scale(1.02);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        
        .ai-menu-popup {
            backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #93c5fd;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && lucide.icons[name]) {
                    lucide.createIcons({
                        icons: { [name]: lucide.icons[name] },
                        nameAttr: 'data-lucide',
                        attrs: { class: className, width: size, height: size }
                    });
                }
            }, [name, size, className]);
            return <i ref={iconRef} data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('eval_assistant_api_key') || '');
            const [isApiSet, setIsApiSet] = useState(() => !!localStorage.getItem('eval_assistant_api_key'));
            const [results, setResults] = useState(() => {
                const saved = localStorage.getItem('eval_assistant_results');
                return saved ? JSON.parse(saved) : [];
            });

            const [teacherName, setTeacherName] = useState('');
            const [goal, setGoal] = useState('');
            const [selfComment, setSelfComment] = useState('');
            const [mustInclude, setMustInclude] = useState('');
            const [feedback, setFeedback] = useState('');
            const [selectedTeacherName, setSelectedTeacherName] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            
            const [aiPopup, setAiPopup] = useState(null);
            const [isAiSuggesting, setIsAiSuggesting] = useState(false);

            const editorRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('eval_assistant_results', JSON.stringify(results));
            }, [results]);

            const currentTeacherData = useMemo(() => 
                results.find(r => r.name === selectedTeacherName), 
            [results, selectedTeacherName]);

            useEffect(() => {
                if (editorRef.current && currentTeacherData) {
                    if (editorRef.current.innerText !== currentTeacherData.currentText) {
                        editorRef.current.innerText = currentTeacherData.currentText;
                    }
                } else if (editorRef.current && !currentTeacherData) {
                    editorRef.current.innerText = "";
                }
            }, [selectedTeacherName, currentTeacherData?.currentText]);

            const handleApiSubmit = (e) => {
                e.preventDefault();
                if (apiKey.trim().length > 10) {
                    localStorage.setItem('eval_assistant_api_key', apiKey);
                    setIsApiSet(true);
                } else {
                    setError('APIキーを正しく入力してね！');
                }
            };

            const handleLogout = () => {
                if(!confirm("APIキーの設定を解除する？（名簿データは消えないよ）")) return;
                localStorage.removeItem('eval_assistant_api_key');
                setApiKey('');
                setIsApiSet(false);
            };

            const handleReset = () => {
                setTeacherName('');
                setGoal('');
                setSelfComment('');
                setMustInclude('');
                setFeedback('');
                setError('');
                setSelectedTeacherName(null);
            };

            const generateAIEval = async () => {
                const targetName = teacherName.trim() || '名称未設定';
                if (!goal || !selfComment) {
                    setError('目標と自己評価は入力必須だよ！');
                    return;
                }
                setLoading(true);
                setError('');

                const systemPrompt = `あなたは学校の管理者（校長・教頭）です。教職員の努力を認め、意欲を高める「ポジティブかつ具体的」な評価文（所見）を作成してください。

【方針】
・対象者の取り組みを肯定的に捉え、称賛と期待を込めた内容にする。
・事実に基づき、学校運営や生徒への貢献を高く評価する。
・「〜でしょう」「〜があるから」「〜と思う」といった話し言葉、不自然な推量、主観的な表現は一切禁止。
・文末は「〜である」「〜が見られる」「〜に寄与した」などの教員評価として適切な文体（常体：だ・である）を徹底する。
・「です・ます」は絶対に使用しない。

【厳守：構成ルール】
・文章の開始に氏名や役職を含めない。
・「〜先生」といった対象への言及は不要。
・第三者視点での客観的かつ温かみのある評価文にする。

【キーワードの組み込み】
・「必ず含めるキーワード」が指定されている場合、必ず文中に含めること。

【厳守：文字数ルール】
・文字数は「180文字以上、200文字以下」を絶対厳守。
・200文字を超えないよう要約し、必ず句点「。」で終わらせること。`;

                const userQuery = `
【目標】：${goal}
【自己評価】：${selfComment}
${mustInclude ? `【必ず含めるキーワード】：${mustInclude}` : ''}
${feedback ? `【追加のこだわり】：${feedback}` : ''}

上記に基づき、プロフェッショナルかつポジティブな180〜200文字の評価文を作成せよ。文末は「だ・である」で統一すること。`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    const data = await response.json();
                    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    let cleanedText = text.trim().replace(/\s+/g, ' ');
                    
                    if (cleanedText.length > 200) {
                        cleanedText = cleanedText.substring(0, 200);
                        const lastPeriod = cleanedText.lastIndexOf('。');
                        if (lastPeriod > 100) cleanedText = cleanedText.substring(0, lastPeriod + 1);
                    }

                    const timestamp = new Date().toLocaleString('ja-JP', { hour: '2-digit', minute: '2-digit' });

                    setResults(prev => {
                        const existingIndex = prev.findIndex(r => r.name === targetName);
                        if (existingIndex > -1) {
                            const updated = [...prev];
                            const oldEntry = updated[existingIndex];
                            const newHistory = [
                                { text: oldEntry.currentText, timestamp: oldEntry.timestamp },
                                ...(oldEntry.history || [])
                            ].slice(0, 3);

                            updated[existingIndex] = {
                                ...oldEntry,
                                currentText: cleanedText,
                                timestamp: timestamp,
                                history: newHistory,
                                inputData: { teacherName: targetName, goal, selfComment, mustInclude, feedback }
                            };
                            return updated;
                        }
                        return [{
                            name: targetName,
                            currentText: cleanedText,
                            timestamp: timestamp,
                            history: [],
                            inputData: { teacherName: targetName, goal, selfComment, mustInclude, feedback }
                        }, ...prev];
                    });
                    setSelectedTeacherName(targetName);
                } catch (err) {
                    setError('APIエラーが発生したよ。キーを再確認してみて！');
                } finally {
                    setLoading(false);
                }
            };

            const handleTextUpdate = (e) => {
                const newText = e.target.innerText;
                setResults(prev => prev.map(r => r.name === selectedTeacherName ? { ...r, currentText: newText } : r));
            };

            const handleTextSelection = () => {
                const selection = window.getSelection();
                const selectedText = selection.toString().trim();
                if (selectedText.length > 0) {
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();
                    setAiPopup({
                        selectedText,
                        top: rect.bottom + window.scrollY + 10,
                        left: rect.left + window.scrollX,
                        options: null // 初期化
                    });
                } else {
                    setAiPopup(null);
                }
            };

            const suggestParaphrase = async () => {
                if (!aiPopup || isAiSuggesting) return;
                setIsAiSuggesting(true);

                const prompt = `あなたは教員評価の専門家です。選択された「${aiPopup.selectedText}」を、評価文として適切かつポジティブな表現に言い換えてください。
【厳守ルール】
・「です・ます」は絶対に使用禁止。
・「〜でしょう」「〜だから」「〜と思う」といった口語や不確かな推量表現は排除。
・文末は「〜である」「〜が見られる」「〜といえる」「〜に努めた」等の断定的な常体（だ・である）にする。
・候補を3つ作成。
{"suggestions": ["候補1", "候補2", "候補3"]}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const data = await response.json();
                    const result = JSON.parse(data.candidates[0].content.parts[0].text);
                    setAiPopup(prev => ({ ...prev, options: result.suggestions }));
                } catch (e) { 
                    console.error(e);
                    setAiPopup(null);
                } 
                finally { setIsAiSuggesting(false); }
            };

            const replaceText = (oldText, newText) => {
                const updatedText = currentTeacherData.currentText.replace(oldText, newText);
                setResults(prev => prev.map(r => r.name === selectedTeacherName ? { ...r, currentText: updatedText } : r));
                if (editorRef.current) editorRef.current.innerText = updatedText;
                setAiPopup(null);
                window.getSelection().removeAllRanges();
            };

            const restoreHistory = (histText) => {
                setResults(prev => prev.map(r => r.name === selectedTeacherName ? { ...r, currentText: histText } : r));
                if (editorRef.current) editorRef.current.innerText = histText;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const loadHistoryEntry = (res) => {
                setSelectedTeacherName(res.name);
                setTeacherName(res.inputData.teacherName);
                setGoal(res.inputData.goal);
                setSelfComment(res.inputData.selfComment);
                setMustInclude(res.inputData.mustInclude || '');
                setFeedback(res.inputData.feedback || '');
            };

            const deleteHistory = (e, name) => {
                e.stopPropagation();
                if(!confirm(`${name}先生のデータを完全に削除してもいいかな？`)) return;
                setResults(prev => prev.filter(r => r.name !== name));
                if (selectedTeacherName === name) setSelectedTeacherName(null);
            };

            const copyToClipboard = (text) => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
            };

            if (!isApiSet) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100">
                        <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-md w-full fade-in border border-blue-100 text-center">
                            <div className="bg-blue-600 w-16 h-16 rounded-2xl text-white flex items-center justify-center mx-auto mb-6 shadow-lg">
                                <Icon name="key" size={32} />
                            </div>
                            <h1 className="text-2xl font-black text-slate-800">おかえり！</h1>
                            <p className="text-slate-400 text-sm font-bold mt-2 leading-relaxed">まずはAPIキーを入力してね</p>
                            <form onSubmit={handleApiSubmit} className="mt-8 space-y-6">
                                <input 
                                    type="password" 
                                    className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 text-center text-lg focus:border-blue-500 outline-none font-mono" 
                                    placeholder="Gemini API Key..."
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                />
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black shadow-md transition-all">
                                    スタート！
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col" onMouseDown={(e) => { if(!e.target.closest('.ai-menu-popup')) setAiPopup(null); }}>
                    <header className="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md">
                        <div className="max-w-[1600px] mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-white p-2 rounded-xl text-blue-600 font-black">教</div>
                                <h1 className="text-xl font-black tracking-tight">AIポジティブ所見</h1>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={handleLogout} className="text-xs font-bold bg-blue-700 px-3 py-1.5 rounded-full hover:bg-blue-800 transition-colors">キー解除</button>
                                <button onClick={handleReset} className="text-xs font-bold hover:underline transition-all">新規作成</button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-[1600px] mx-auto w-full flex flex-col lg:flex-row gap-6 p-4 lg:p-6 overflow-hidden">
                        <div className="w-full lg:w-1/4 space-y-4 overflow-y-auto custom-scrollbar pr-1">
                            <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-blue-100">
                                <h2 className="text-sm font-black mb-5 flex items-center gap-2 text-blue-700">
                                    <Icon name="pen-tool" size={16} /> 先生の情報
                                </h2>
                                <div className="space-y-4 text-left">
                                    <div>
                                        <label className="text-[10px] font-black text-blue-400 mb-1 block uppercase">氏名</label>
                                        <input type="text" className="w-full bg-blue-50/50 border-2 border-blue-100 rounded-xl p-3 text-sm focus:border-blue-400 outline-none font-bold" value={teacherName} onChange={(e) => setTeacherName(e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-blue-400 mb-1 block uppercase">本年度の目標</label>
                                        <textarea className="w-full bg-blue-50/50 border-2 border-blue-100 rounded-xl p-3 text-sm focus:border-blue-400 outline-none h-16 resize-none" value={goal} onChange={(e) => setGoal(e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-blue-400 mb-1 block uppercase">自己評価</label>
                                        <textarea className="w-full bg-blue-50/50 border-2 border-blue-100 rounded-xl p-3 text-sm focus:border-blue-400 outline-none h-24 resize-none" value={selfComment} onChange={(e) => setSelfComment(e.target.value)} />
                                    </div>
                                    <div className="pt-2">
                                        <label className="text-[10px] font-black text-indigo-500 mb-1 block uppercase">含めるキーワード</label>
                                        <input type="text" className="w-full bg-indigo-50 border-2 border-indigo-200 rounded-xl p-3 text-sm focus:border-indigo-400 outline-none font-black" value={mustInclude} onChange={(e) => setMustInclude(e.target.value)} placeholder="例: 授業改善, 部活動指導" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-cyan-600 mb-1 block uppercase">こだわり指示</label>
                                        <textarea className="w-full bg-cyan-50 border-2 border-cyan-100 rounded-xl p-3 text-sm focus:border-cyan-400 outline-none h-14 resize-none" value={feedback} onChange={(e) => setFeedback(e.target.value)} />
                                    </div>
                                </div>
                                {error && <p className="mt-4 text-xs font-bold text-red-500">{error}</p>}
                                <button onClick={generateAIEval} disabled={loading} className={`w-full mt-6 py-4 rounded-2xl font-black text-white shadow-md transition-all flex items-center justify-center gap-3 ${loading ? 'bg-slate-300' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                    {loading ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="sparkles" />}
                                    案を作成する
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col gap-8 overflow-y-auto custom-scrollbar pb-10">
                            {currentTeacherData ? (
                                <>
                                    <div className="bg-white rounded-[2.5rem] p-8 shadow-sm border border-blue-200 flex flex-col relative">
                                        <div className="flex justify-between items-center mb-6">
                                            <div className="flex items-center gap-3">
                                                <h3 className="text-xl font-black text-blue-900">{currentTeacherData.name} 先生</h3>
                                            </div>
                                            <button onClick={() => copyToClipboard(currentTeacherData.currentText)} className="flex items-center gap-2 px-6 py-2 bg-blue-100 text-blue-700 rounded-full text-xs font-black hover:bg-blue-200 transition-all">
                                                <Icon name="copy" size={14} /> コピー
                                            </button>
                                        </div>

                                        <div 
                                            ref={editorRef}
                                            className="eval-text-area"
                                            contentEditable
                                            onMouseUp={handleTextSelection}
                                            onInput={handleTextUpdate}
                                            suppressContentEditableWarning={true}
                                        >
                                        </div>

                                        <div className="mt-6 flex justify-end">
                                            <div className="text-right">
                                                <p className="text-[10px] font-black text-blue-400 uppercase mb-1 tracking-wider">文字数</p>
                                                <p className={`text-xl font-black ${currentTeacherData.currentText.length < 180 || currentTeacherData.currentText.length > 200 ? 'text-red-500' : 'text-blue-600'}`}>
                                                    {currentTeacherData.currentText.length} <span className="text-xs opacity-40">/ 200</span>
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    {currentTeacherData.history && currentTeacherData.history.map((hist, idx) => (
                                        <div key={idx} className="bg-white/70 rounded-[2.25rem] p-8 border-2 border-dashed border-blue-200 flex flex-col opacity-80 hover:opacity-100 transition-opacity">
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">履歴 ({hist.timestamp})</span>
                                                <button onClick={() => restoreHistory(hist.text)} className="text-[10px] font-black text-blue-600 hover:text-blue-800 flex items-center gap-1 bg-blue-50 px-3 py-1.5 rounded-full border border-blue-100">
                                                    <Icon name="rotate-ccw" size={10} /> 戻す
                                                </button>
                                            </div>
                                            <div className="history-text-area">{hist.text}</div>
                                        </div>
                                    ))}
                                </>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center text-blue-100 border-4 border-dashed border-blue-100 rounded-[3rem] bg-white min-h-[400px]">
                                    <Icon name="user-plus" size={80} className="mb-6 opacity-20" />
                                    <p className="text-xl font-black tracking-widest opacity-30 text-center">名簿から選ぶか<br/>新しい案を作成してみてね</p>
                                </div>
                            )}
                        </div>

                        <div className="w-full lg:w-64 flex flex-col h-[400px] lg:h-auto">
                            <div className="bg-yellow-400 p-5 rounded-[2.5rem] flex-1 flex flex-col overflow-hidden shadow-lg border-t-4 border-yellow-500">
                                <h2 className="text-sm font-black mb-4 flex items-center gap-2 text-yellow-900 border-b border-yellow-500/30 pb-3 uppercase tracking-widest">
                                    <Icon name="users" size={16} /> 保存済みの先生
                                </h2>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2">
                                    {results.map(res => (
                                        <div 
                                            key={res.name} 
                                            onClick={() => loadHistoryEntry(res)} 
                                            className={`sidebar-item group p-4 rounded-2xl cursor-pointer flex items-center justify-between shadow-sm ${selectedTeacherName === res.name ? 'active' : 'hover:bg-yellow-300'}`}
                                        >
                                            <div className="overflow-hidden text-left flex-1 mr-2">
                                                <p className="text-sm font-black truncate">{res.name} 先生</p>
                                                <p className="text-[9px] opacity-60 font-medium">{res.timestamp}</p>
                                            </div>
                                            <button 
                                                onClick={(e) => deleteHistory(e, res.name)} 
                                                className={`p-1.5 rounded-lg transition-all ${selectedTeacherName === res.name ? 'hover:bg-white/20 text-white' : 'text-yellow-700 hover:bg-red-500 hover:text-white'}`}
                                            >
                                                <Icon name="x" size={14} />
                                            </button>
                                        </div>
                                    ))}
                                    {results.length === 0 && <p className="text-[10px] text-yellow-900/40 text-center font-bold mt-10 px-4">まだデータがありません</p>}
                                </div>
                            </div>
                        </div>
                    </main>

                    {aiPopup && (
                        <div className="ai-menu-popup fixed z-[100] p-2 rounded-2xl w-72 text-blue-900 shadow-2xl fade-in" style={{ top: Math.min(aiPopup.top, window.innerHeight - 250), left: Math.min(aiPopup.left, window.innerWidth - 300) }}>
                            {!aiPopup.options ? (
                                <button 
                                    onClick={suggestParaphrase} 
                                    disabled={isAiSuggesting}
                                    className={`w-full flex items-center gap-3 p-3 rounded-xl font-bold text-sm transition-all ${isAiSuggesting ? 'bg-slate-200 text-slate-500 cursor-not-allowed' : 'hover:bg-blue-50 text-blue-700'}`}
                                >
                                    {isAiSuggesting ? (
                                        <>
                                            <Icon name="loader-2" className="animate-spin" size={16} />
                                            修正中...
                                        </>
                                    ) : (
                                        <>
                                            <Icon name="sparkles" size={16} className="text-blue-500" />
                                            AI修正
                                        </>
                                    )}
                                </button>
                            ) : (
                                <div className="space-y-1">
                                    <div className="text-[10px] text-blue-400 px-3 py-2 uppercase font-black flex justify-between items-center border-b border-blue-50 mb-1">
                                        <span>AIの言い換え提案</span>
                                        <button onClick={() => setAiPopup(null)} className="hover:text-blue-600"><Icon name="x" size={12} /></button>
                                    </div>
                                    {aiPopup.options.map((opt, i) => (
                                        <button key={i} onClick={() => replaceText(aiPopup.selectedText, opt)} className="w-full text-left p-3 hover:bg-blue-600 hover:text-white rounded-xl text-xs font-bold leading-relaxed transition-all">
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
