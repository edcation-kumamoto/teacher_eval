<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI教員評価アシスタント</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@lucide/lab@latest"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .eval-text-area {
            font-size: 1.1rem;
            line-height: 2;
            padding: 1.5rem;
            min-height: 200px;
            white-space: pre-wrap;
            border-radius: 1rem;
            border: 2px solid #e2e8f0;
            background: white;
            outline: none;
            transition: border-color 0.2s;
        }
        .eval-text-area:focus { border-color: #3b82f6; }
        .sidebar-item { transition: all 0.2s; cursor: pointer; }
        .sidebar-item.active { background-color: #ca8a04 !important; color: white !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .ai-menu-popup {
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            border-radius: 1rem;
            z-index: 1000;
        }
        .tab-btn {
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
            background-color: #eff6ff;
        }
        .history-card {
            font-size: 0.9rem;
            line-height: 1.6;
            background: #f1f5f9;
            border-left: 4px solid #cbd5e1;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && lucide.icons[name]) {
                    const el = iconRef.current;
                    el.innerHTML = '';
                    lucide.createIcons({
                        icons: { [name]: lucide.icons[name] },
                        nameAttr: 'data-lucide',
                        attrs: { class: className, width: size, height: size }
                    });
                }
            }, [name, size, className]);
            return <i ref={iconRef} data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('eval_api_key') || '');
            const [isApiSet, setIsApiSet] = useState(() => !!localStorage.getItem('eval_api_key'));
            const [results, setResults] = useState(() => JSON.parse(localStorage.getItem('eval_results_v10') || '[]'));
            
            const [teacherName, setTeacherName] = useState('');
            const [activeCategory, setActiveCategory] = useState('教科指導');
            const INITIAL_INPUT_STATE = {
                '教科指導': { goal: '', selfComment: '', mustInclude: '', feedback: '', reference: '' },
                '生活指導': { goal: '', selfComment: '', mustInclude: '', feedback: '', reference: '' },
                '公務': { goal: '', selfComment: '', mustInclude: '', feedback: '', reference: '' }
            };
            const [inputState, setInputState] = useState(INITIAL_INPUT_STATE);
            
            const [selectedId, setSelectedId] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [aiPopup, setAiPopup] = useState(null);
            const [isAiSuggesting, setIsAiSuggesting] = useState(false);
            const [copyFeedback, setCopyFeedback] = useState(false);
            const [currentCharCount, setCurrentCharCount] = useState(0);

            const editorRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('eval_results_v10', JSON.stringify(results));
            }, [results]);

            const currentTeacher = useMemo(() => results.find(r => r.id === selectedId), [results, selectedId]);
            const currentContent = useMemo(() => currentTeacher?.contents?.[activeCategory] || '', [currentTeacher, activeCategory]);
            
            const history = useMemo(() => {
                if (!currentTeacher || !currentTeacher.history) return [];
                return (currentTeacher.history[activeCategory] || []).slice(0, 2);
            }, [currentTeacher, activeCategory]);

            // カテゴリ切り替えや先生選択時にエディタの内容を同期する
            useEffect(() => {
                if (editorRef.current) {
                    editorRef.current.innerText = currentContent;
                    setCurrentCharCount(currentContent.length);
                }
            }, [selectedId, activeCategory, currentContent]); // currentContentも監視対象に追加

            const handleApiSubmit = (e) => {
                e.preventDefault();
                if (apiKey.trim()) {
                    localStorage.setItem('eval_api_key', apiKey);
                    setIsApiSet(true);
                }
            };

            const resetToInitial = () => {
                setSelectedId(null);
                setTeacherName('');
                setInputState(INITIAL_INPUT_STATE);
                setCurrentCharCount(0);
                if (editorRef.current) editorRef.current.innerText = '';
            };

            const handleCopy = () => {
                const text = editorRef.current?.innerText || "";
                if (!text) return;
                
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopyFeedback(true);
                    setTimeout(() => setCopyFeedback(false), 2000);
                } catch (err) {
                    console.error('Copy failed', err);
                }
                document.body.removeChild(textArea);
            };

            // フォーカスが外れた時だけStateに保存する（カーソル飛び防止）
            const handleEditorBlur = () => {
                if (!selectedId) return;
                const txt = editorRef.current.innerText;
                if (txt === currentContent) return;

                setResults(prev => prev.map(r => r.id === selectedId ? {
                    ...r, 
                    contents: { ...r.contents, [activeCategory]: txt }
                } : r));
            };

            const handleEditorInput = (e) => {
                setCurrentCharCount(e.target.innerText.length);
            };

            const callGemini = async (prompt, systemInstruction = "", isJson = false) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }]
                };
                if (systemInstruction) {
                    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                }
                if (isJson) {
                    payload.generationConfig = { responseMimeType: "application/json" };
                }

                // Exponential Backoff
                let delay = 1000;
                for (let i = 0; i < 5; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    } catch (err) {
                        if (i === 4) throw err;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                    }
                }
            };

            const generateEval = async () => {
                const cur = inputState[activeCategory];
                if (!cur.goal || !cur.selfComment) {
                    setError(`${activeCategory}の目標と自己評価を入力してね。`);
                    return;
                }
                setLoading(true);
                setError('');
                
                const system = `教員評価の専門家として、教員の「${activeCategory}」に関するポジティブな所見を、自然な「だ・である」調で作成してください。

【厳守：絶対ルール】
1. 文字数制限：句読点を含めて「必ず160文字以上、200文字以内」に収めること。200文字を1文字でも超えてはならない。
2. 文体：主語（〇〇先生は等）を省き、評価の本文から書き始める。「〜である」「〜を図った」などの断定表現のみを使い、「〜と思われる」等の推測は禁止。
3. 出力内容：評価本文のみを出力すること。前置き、解説、挨拶、文字数カウントなどの余計なテキストは一切含めない。
4. 参考の反映：${cur.reference ? `「参考」欄のトーンを模倣しつつ、上記ルール内で作成すること。` : ''}`;
                
                const prompt = `以下の情報を元に、200文字以内の評価文を作成してください。
カテゴリ: ${activeCategory}
目標: ${cur.goal}
自己評価: ${cur.selfComment}
キーワード: ${cur.mustInclude}
追加指示: ${cur.feedback}
参考資料: ${cur.reference}`;

                try {
                    const text = await callGemini(prompt, system);
                    const cleanText = text.trim().replace(/^[\s\S]*本文：/g, "").replace(/（?\d+文字）?$/g, "").trim();
                    
                    if (selectedId) {
                        setResults(prev => prev.map(r => {
                            if (r.id === selectedId) {
                                const oldContent = r.contents[activeCategory];
                                const updatedHistory = { ...(r.history || {}) };
                                // 履歴に保存（今の内容と違う場合のみ）
                                if (oldContent && oldContent !== cleanText) {
                                    updatedHistory[activeCategory] = [oldContent, ...(updatedHistory[activeCategory] || [])].slice(0, 5);
                                }
                                
                                return {
                                    ...r,
                                    name: teacherName || r.name,
                                    contents: { ...r.contents, [activeCategory]: cleanText },
                                    inputData: { ...r.inputData, [activeCategory]: { ...cur } },
                                    history: updatedHistory,
                                    timestamp: new Date().toLocaleString('ja-JP')
                                };
                            }
                            return r;
                        }));
                    } else {
                        const newId = Date.now().toString();
                        const newResult = {
                            id: newId,
                            name: teacherName || '未設定',
                            contents: { '教科指導': '', '生活指導': '', '公務': '', [activeCategory]: cleanText },
                            inputData: { ...inputState, [activeCategory]: { ...cur } },
                            history: { [activeCategory]: [] },
                            timestamp: new Date().toLocaleString('ja-JP')
                        };
                        setResults(prev => [newResult, ...prev]);
                        setSelectedId(newId);
                    }
                    
                    // 生成完了時、エディタに直接反映させて強制同期
                    if (editorRef.current) {
                        editorRef.current.innerText = cleanText;
                    }
                    setCurrentCharCount(cleanText.length);
                } catch (err) {
                    setError('生成に失敗したよ。');
                } finally {
                    setLoading(false);
                }
            };

            const deleteEntry = (e, id, name) => {
                e.stopPropagation();
                if (window.confirm(`${name}先生のデータを削除するよ？`)) {
                    setResults(prev => prev.filter(r => r.id !== id));
                    resetToInitial();
                }
            };

            const handleSelection = () => {
                const selection = window.getSelection();
                const text = selection.toString().trim();
                if (text && editorRef.current && editorRef.current.contains(selection.anchorNode)) {
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();
                    setAiPopup({ text, top: rect.bottom + window.scrollY, left: rect.left + window.scrollX });
                } else {
                    setAiPopup(null);
                }
            };

            const getSuggestions = async () => {
                setIsAiSuggesting(true);
                try {
                    const prompt = `「${aiPopup.text}」を「${activeCategory}」の文脈で、自然な「だ・である」調で3パターン言い換えて。
条件：
・主語や名前は含めない
・「〜であろう」等の推測表現は使わず、断定形で書く
・本文のみ、JSON形式: {"suggestions": ["案1", "案2", "案3"]}`;
                    const res = await callGemini(prompt, "言い換えの専門家として、指示された JSON のみを出力してください。", true);
                    const parsed = JSON.parse(res);
                    setAiPopup(prev => ({ ...prev, options: parsed.suggestions }));
                } catch (e) {
                    setError('言い換えに失敗したよ。');
                    setAiPopup(null);
                } finally {
                    setIsAiSuggesting(false);
                }
            };

            const applySuggestion = (newText) => {
                const fullText = editorRef.current.innerText;
                const updatedText = fullText.replace(aiPopup.text, newText);
                
                setResults(prev => prev.map(r => {
                    if (r.id === selectedId) {
                        const oldContent = r.contents[activeCategory];
                        const updatedHistory = { ...(r.history || {}) };
                        if (oldContent && oldContent !== updatedText) {
                            updatedHistory[activeCategory] = [oldContent, ...(updatedHistory[activeCategory] || [])].slice(0, 5);
                        }
                        return {
                            ...r,
                            contents: { ...r.contents, [activeCategory]: updatedText },
                            history: updatedHistory
                        };
                    }
                    return r;
                }));
                if (editorRef.current) {
                    editorRef.current.innerText = updatedText;
                }
                setCurrentCharCount(updatedText.length);
                setAiPopup(null);
            };

            if (!isApiSet) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100">
                        <div className="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full border border-slate-200">
                            <h2 className="text-xl font-bold mb-4 text-center">APIキーを設定</h2>
                            <form onSubmit={handleApiSubmit} className="space-y-4">
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="w-full p-3 border rounded-xl outline-none focus:border-blue-500" placeholder="Gemini APIキーを入力..." />
                                <button className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all">開始</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col max-w-[1400px] mx-auto p-4 lg:p-6 gap-6 h-screen overflow-hidden text-slate-800">
                    <header className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex-shrink-0">
                        <h1 className="text-xl font-black text-blue-600 flex items-center gap-2">
                            <Icon name="sparkles" /> AI教員評価アシスタント
                        </h1>
                        <div className="flex gap-4 items-center">
                            <button onClick={() => setIsApiSet(false)} className="text-xs font-bold text-blue-500 hover:text-blue-700 flex items-center gap-1">
                                <Icon name="key" size={12} /> APIキー変更
                            </button>
                            <button onClick={() => {if(confirm('設定をリセットするよ？今までのデータはすべて消えます。')) {localStorage.clear(); location.reload();}}} className="text-xs text-slate-400 hover:text-red-500">設定リセット</button>
                        </div>
                    </header>

                    <div className="flex flex-col lg:flex-row gap-6 flex-1 overflow-hidden">
                        <div className="w-full lg:w-80 space-y-4 overflow-y-auto pr-2 custom-scrollbar flex-shrink-0">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                                <div className="pb-4 border-b border-slate-100">
                                    <label className="text-[10px] font-bold text-slate-400 block mb-1 uppercase tracking-widest">対象の先生</label>
                                    <input 
                                        value={teacherName} 
                                        onChange={e => setTeacherName(e.target.value)} 
                                        className="w-full p-2 bg-slate-50 rounded-lg border focus:border-blue-500 outline-none text-sm font-bold" 
                                        placeholder="名前を入力" 
                                    />
                                </div>
                                
                                <div className="space-y-4">
                                    <div className="flex items-center gap-2 text-blue-600 font-bold text-xs">
                                        <Icon name="edit-3" size={14}/> {activeCategory}の詳細
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 block mb-1">本年度の目標</label>
                                        <textarea 
                                            value={inputState[activeCategory].goal} 
                                            onChange={e => setInputState(prev => ({...prev, [activeCategory]: {...prev[activeCategory], goal: e.target.value}}))} 
                                            className="w-full p-2 bg-slate-50 rounded-lg border h-16 text-sm resize-none outline-none focus:border-blue-500" 
                                            placeholder="目標を入力..." 
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 block mb-1">本人の自己評価</label>
                                        <textarea 
                                            value={inputState[activeCategory].selfComment} 
                                            onChange={e => setInputState(prev => ({...prev, [activeCategory]: {...prev[activeCategory], selfComment: e.target.value}}))} 
                                            className="w-full p-2 bg-slate-50 rounded-lg border h-16 text-sm resize-none outline-none focus:border-blue-500" 
                                            placeholder="自己評価コメントを入力..." 
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 block mb-1">必須キーワード</label>
                                        <input 
                                            value={inputState[activeCategory].mustInclude} 
                                            onChange={e => setInputState(prev => ({...prev, [activeCategory]: {...prev[activeCategory], mustInclude: e.target.value}}))} 
                                            className="w-full p-2 bg-slate-50 rounded-lg border text-sm outline-none focus:border-blue-500" 
                                            placeholder="含めたい言葉..." 
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-amber-600 block mb-1 uppercase tracking-wider">追加の指示</label>
                                        <input 
                                            value={inputState[activeCategory].feedback} 
                                            onChange={e => setInputState(prev => ({...prev, [activeCategory]: {...prev[activeCategory], feedback: e.target.value}}))} 
                                            className="w-full p-2 bg-amber-50 rounded-lg border border-amber-100 text-sm outline-none focus:border-amber-500" 
                                            placeholder="例：より具体的に" 
                                        />
                                    </div>
                                    
                                    <div className="pt-2 border-t border-dashed border-slate-200">
                                        <label className="text-[10px] font-bold text-indigo-500 block mb-1 uppercase tracking-wider flex items-center gap-1">
                                            <Icon name="history" size={10} /> 参考（前回の評価など）
                                        </label>
                                        <textarea 
                                            value={inputState[activeCategory].reference} 
                                            onChange={e => setInputState(prev => ({...prev, [activeCategory]: {...prev[activeCategory], reference: e.target.value}}))} 
                                            className="w-full p-2 bg-indigo-50 rounded-lg border border-indigo-100 h-16 text-[11px] resize-none outline-none focus:border-indigo-500 text-indigo-900" 
                                            placeholder="過去の評価文を貼るとそれっぽくなります..." 
                                        />
                                    </div>
                                </div>

                                <button onClick={generateEval} disabled={loading} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-700 transition-all shadow-lg active:scale-95 disabled:bg-blue-400">
                                    {loading ? (
                                        <>
                                            <Icon name="loader-2" className="animate-spin" />
                                            生成中...
                                        </>
                                    ) : (
                                        <>
                                            <Icon name="wand-2" />
                                            評価を生成する
                                        </>
                                    )}
                                </button>
                                {error && <p className="text-xs text-red-500 text-center font-bold">{error}</p>}
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col gap-0 overflow-hidden bg-white rounded-3xl shadow-sm border border-slate-100">
                            <div className="flex border-b flex-shrink-0 bg-slate-50 rounded-t-3xl">
                                {['教科指導', '生活指導', '公務'].map(cat => (
                                    <button
                                        key={cat}
                                        onClick={() => setActiveCategory(cat)}
                                        className={`tab-btn flex-1 py-4 text-sm font-bold flex items-center justify-center gap-2 ${activeCategory === cat ? 'active' : 'text-slate-400 hover:text-slate-600'}`}
                                    >
                                        <Icon name={cat === '教科指導' ? 'book-open' : cat === '生活指導' ? 'heart' : 'briefcase'} size={16} />
                                        {cat}
                                    </button>
                                ))}
                            </div>

                            <div className="p-6 flex-1 flex flex-col overflow-hidden">
                                {selectedId ? (
                                    <div className="flex-1 flex flex-col overflow-hidden">
                                        <div 
                                            ref={editorRef}
                                            className="eval-text-area flex-1 overflow-y-auto custom-scrollbar shadow-inner"
                                            contentEditable
                                            onMouseUp={handleSelection}
                                            onInput={handleEditorInput}
                                            onBlur={handleEditorBlur}
                                            suppressContentEditableWarning={true}
                                        />
                                        <div className="mt-4 flex justify-between items-center flex-shrink-0 bg-slate-50 p-2 pl-4 rounded-xl border">
                                            <div className="text-xs font-bold">
                                                <span className="text-slate-400">文字数: </span>
                                                <span className={currentCharCount > 200 ? 'text-red-500 font-black px-2 py-0.5 bg-red-50 rounded' : 'text-blue-600'}>{currentCharCount}</span>
                                                <span className="text-slate-400"> / 200</span>
                                            </div>
                                            <button 
                                                onClick={handleCopy}
                                                className={`flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm transition-all shadow-sm ${copyFeedback ? 'bg-green-500 text-white' : 'bg-white text-blue-600 hover:bg-blue-50 border border-blue-100'}`}
                                            >
                                                <Icon name={copyFeedback ? "check" : "copy"} size={14} />
                                                {copyFeedback ? "コピーしました！" : "最新をコピー"}
                                            </button>
                                        </div>

                                        {history.length > 0 && (
                                            <div className="mt-6 pt-6 border-t border-slate-100 flex-shrink-0 overflow-hidden flex flex-col max-h-[250px]">
                                                <h4 className="text-[10px] font-bold text-slate-400 mb-3 uppercase tracking-widest flex items-center gap-2">
                                                    <Icon name="history" size={12} /> 履歴（以前の生成内容）
                                                </h4>
                                                <div className="overflow-y-auto custom-scrollbar space-y-3 pb-2">
                                                    {history.map((text, idx) => (
                                                        <div key={idx} className="history-card p-3 rounded-xl border border-slate-200 group relative">
                                                            <div className="text-[9px] text-slate-400 mb-1 font-bold">
                                                                {idx === 0 ? '前回' : '前々回'}
                                                            </div>
                                                            <div className="text-slate-600 whitespace-pre-wrap">{text}</div>
                                                            <button 
                                                                onClick={() => {
                                                                    if(confirm('この内容をエディタに戻す？')) {
                                                                        if (editorRef.current) editorRef.current.innerText = text;
                                                                        setCurrentCharCount(text.length);
                                                                        handleEditorBlur();
                                                                    }
                                                                }}
                                                                className="absolute top-2 right-2 p-1.5 bg-white shadow-sm rounded-lg opacity-0 group-hover:opacity-100 transition-opacity hover:text-blue-600"
                                                            >
                                                                <Icon name="rotate-ccw" size={12} />
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="flex-1 flex flex-col items-center justify-center text-slate-300 font-bold text-center">
                                        <Icon name="user-plus" size={48} className="mb-4 opacity-20" />
                                        左で名前を入れて評価を生成するか、<br/>右のリストから先生を選択してね。
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="w-full lg:w-64 bg-yellow-400 p-4 rounded-3xl shadow-lg flex flex-col border-t-4 border-yellow-500 flex-shrink-0 overflow-hidden text-yellow-900">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-sm font-black flex items-center gap-2 uppercase">
                                    <Icon name="users" size={16} /> 先生一覧
                                </h3>
                                <button onClick={resetToInitial} className="p-1.5 bg-yellow-500 hover:bg-yellow-600 text-yellow-900 rounded-lg transition-colors border border-yellow-600/20">
                                    <Icon name="plus" size={16} />
                                </button>
                            </div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2">
                                {results.map(res => (
                                    <div 
                                        key={res.id} 
                                        onClick={() => {
                                            setSelectedId(res.id);
                                            setTeacherName(res.name);
                                            if (res.inputData) setInputState(res.inputData);
                                        }}
                                        className={`sidebar-item p-3 rounded-xl flex items-center justify-between bg-white shadow-sm border-b-2 border-yellow-500/20 ${selectedId === res.id ? 'active' : 'hover:bg-yellow-50'}`}
                                    >
                                        <div className="flex flex-col flex-1 min-w-0 text-slate-800">
                                            <span className="text-sm font-bold truncate">{res.name} 先生</span>
                                            <div className="flex gap-1 mt-1">
                                                {['教科指導', '生活指導', '公務'].map(c => (
                                                    <div key={c} className={`w-1.5 h-1.5 rounded-full ${res.contents[c] ? 'bg-green-400' : 'bg-slate-200'}`}></div>
                                                ))}
                                            </div>
                                        </div>
                                        <button onClick={(e) => deleteEntry(e, res.id, res.name)} className={`p-1 rounded-md transition-colors ml-2 ${selectedId === res.id ? 'hover:bg-red-700 text-white' : 'text-yellow-700 hover:bg-red-500 hover:text-white'}`}>
                                            <Icon name="x" size={14} />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {aiPopup && (
                        <div className="ai-menu-popup fixed p-2 w-72 shadow-2xl border-2 border-blue-100" style={{ top: aiPopup.top + 10, left: Math.min(aiPopup.left, window.innerWidth - 300) }}>
                            {!aiPopup.options ? (
                                <button onClick={getSuggestions} disabled={isAiSuggesting} className={`w-full p-3 flex items-center justify-center gap-2 rounded-lg font-bold text-sm transition-all ${isAiSuggesting ? 'bg-slate-100 text-slate-400' : 'bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white'}`}>
                                    {isAiSuggesting ? <><Icon name="loader-2" className="animate-spin" size={14}/>修正中...</> : <><Icon name="sparkles" size={14}/>AIで言い換える</>}
                                </button>
                            ) : (
                                <div className="space-y-1">
                                    <div className="text-[9px] text-slate-400 p-2 font-bold border-b mb-1 flex justify-between items-center uppercase tracking-widest">
                                        <span>AIの提案</span>
                                        <button onClick={() => setAiPopup(null)} className="hover:text-red-500"><Icon name="x" size={10}/></button>
                                    </div>
                                    {aiPopup.options.map((opt, i) => (
                                        <button key={i} onClick={() => applySuggestion(opt)} className="w-full text-left p-3 hover:bg-blue-600 hover:text-white rounded-lg text-[11px] font-medium leading-relaxed transition-colors border border-transparent">
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
